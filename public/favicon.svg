<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071A24"/>
      <stop offset="50%" stop-color="#0D5771"/>
      <stop offset="100%" stop-color="#083D50"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3498E3"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Backbone "C" Flow Pipeline -->
  <path d="M 34,13 C 21,7 9,15 9,24 C 9,33 21,41 34,35"
        stroke="url(#stream)" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>

  <!-- Active Wave -->
  <path d="M 15,18 C 12,21 12,27 15,30"
        stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8" vector-effect="non-scaling-stroke"/>

  <!-- Dotted Dispatch Links -->
  <path d="M 24,24 L 34,13 M 24,24 L 34,35"
        stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7" vector-effect="non-scaling-stroke"/>

  <!-- Top Node (Sky Blue) -->
  <rect x="30" y="9" width="7.5" height="7.5" rx="2.5" fill="#38BDF8" transform="rotate(12 33.75 12.75)"/>
  <circle cx="33.75" cy="12.75" r="1.2" fill="#FFFFFF"/>

  <!-- Center Hub Node (Teal) -->
  <rect x="20.25" y="20.25" width="7.5" height="7.5" rx="2.5" fill="#3498E3" transform="rotate(45 24 24)"/>
  <circle cx="24" cy="24" r="1.2" fill="#FFFFFF"/>

  <!-- Bottom Node (Emerald) -->
  <rect x="30" y="31.25" width="7.5" height="7.5" rx="2.5" fill="#34D399" transform="rotate(-12 33.75 35)"/>
  <circle cx="33.75" cy="35" r="1.2" fill="#FFFFFF"/>
</svg>
